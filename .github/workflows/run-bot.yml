name: Run Blue-Tone Bot

on: 
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # প্রতি ৩০ মিনিট পর পর এটি ট্রিগার হবে

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Start Bot
      run: node index.js
